# meshcored for the WiFi Pineapple Pager + Glytch Mesh Mod (CH341 USB-SPI + E22 SX1262).
# Pin numbers are CH341 GPIOs D0..D7, the same wiring as Meshtastic's
# lora-usb-meshtoad-e22 profile. The radio values below only apply while the
# radio initialises; the companion then uses its saved settings (first boot:
# EU/UK (Narrow), 18 dBm), which you change from the MeshCore app.

advert_name = Pager
admin_password = password
lat = 0.0
lon = 0.0

lora_nss_pin = 0
lora_rxen_pin = 1
lora_reset_pin = 2
lora_busy_pin = 4
lora_irq_pin = 6
dio2_as_rf_switch = 1
lora_tcxo = 1.8
rx_boosted_gain = 1
current_limit = 140

# EU/UK (Narrow)
lora_freq = 869.618
lora_bw = 62.5
lora_sf = 8
lora_cr = 8
lora_tx_power = 18

companion_tcp_port = 5000
companion_tcp_bind = 0.0.0.0
console_path = /tmp/meshcored-console
